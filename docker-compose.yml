services:
  backend:
    build: ./backend
    container_name: psyblog-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - ./backend/.env
    networks:
      - shared-network

  frontend:
    build: ./frontend
    container_name: psyblog-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - shared-network

networks:
  shared-network:
    external: true